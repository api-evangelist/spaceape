description: 'Space Ape Games is a London-based mobile game developer, founded in 2012, that
  became part of Supercell after Supercell took a majority stake in 2017 and fully acquired the studio.
  As a consumer mobile-gaming studio it ships player-facing game titles rather than a developer platform:
  as of this enrichment pass the former company site spaceapegames.com returns an HTTP 302 redirect to
  supercell.com, and no public developer API, developer portal, or API documentation is published for
  Space Ape Games or its parent Supercell (Supercell references only a Developer Grants Program, not an
  API). This profile was surfaced as a northzone portfolio company and added to the API Evangelist network
  as a lead; it currently exposes no API surface to enrich.'
